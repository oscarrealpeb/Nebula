name: nebula
description: App educativa para ninos con TEA basada en juegos espaciales.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  lottie: ^2.7.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  image_picker: ^1.1.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.3
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.3.0
  internet_connection_checker_plus: ^2.7.2
  crypto: ^3.0.6
  audioplayers: ^5.2.1
  speech_to_text: ^7.3.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  firebase_auth_platform_interface: ^7.7.3
  firebase_auth_mocks: ^0.14.2
  fake_cloud_firestore: ^3.1.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/games/
    - assets/images/facil/
    - assets/images/medio/
    - assets/images/dificil/
    - assets/images/conecta/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/nebula_logo_final.png"
